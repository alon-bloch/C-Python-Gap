<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Sorting Visualizer | Premium Edition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Bus Sorting <span class="accent">Visualizer</span></h1>
            <p class="subtitle">Real-time C-Logic Pointer Simulation</p>
        </header>

        <main>
            <section class="control-panel">
                <div class="card">
                    <h3>Controls</h3>
                    <div class="input-group">
                        <label for="sort-criteria">Sort By:</label>
                        <select id="sort-criteria" class="custom-select">
                            <option value="name">Name</option>
                            <option value="distance">Distance</option>
                            <option value="duration">Duration</option>
                            <option value="frequency">Frequency</option>
                        </select>
                    </div>

                    <div id="algo-type-container" class="input-group">
                        <label>Variant:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="algo-type" value="standard" checked> Standard</label>
                            <label><input type="radio" name="algo-type" value="aborted"> Aborted</label>
                        </div>
                    </div>

                    <div class="button-group">
                        <button id="btn-load-default" class="btn-secondary">Load Default (13 Lines)</button>
                        <button id="btn-clear-all" class="btn-secondary" style="border-color: var(--danger); color: var(--danger);">Clear All</button>
                        <button id="btn-start-sort" class="btn-primary">Start Bubble Sort</button>
                    </div>
                    <div class="active-criteria-display">
                        Sorting by: <span id="current-criteria-label" class="accent">Name</span>
                    </div>
                    <div class="playback-controls">
                        <button id="btn-prev" class="btn-icon" disabled>Prev</button>
                        <button id="btn-play" class="btn-icon">Auto Play</button>
                        <span id="step-counter">Step: 0 / 0</span>
                        <button id="btn-next" class="btn-icon" disabled>Next</button>
                    </div>
                    <div class="status-msg" id="status-msg">Ready to sort...</div>
                </div>

                <div class="card metrics-card">
                    <h3>Performance Metrics</h3>
                    <div class="pointer-item">
                        <span class="label">Comparisons:</span>
                        <span id="metric-comps" class="value">-</span>
                    </div>
                    <div class="pointer-item">
                        <span class="label">Swaps:</span>
                        <span id="metric-swaps" class="value">-</span>
                    </div>
                    <div class="pointer-item">
                        <span class="label">Calc Time:</span>
                        <span id="metric-time" class="value">-</span>
                    </div>
                </div>

                <div class="card">
                    <h3>Memory Pointers</h3>
                    <div class="pointer-item">
                        <span class="label">pivot:</span>
                        <span id="ptr-i" class="value">0x----</span>
                    </div>
                    <div class="pointer-item">
                        <span class="label">small:</span>
                        <span id="ptr-j" class="value">0x----</span>
                    </div>
                    <div class="pointer-item">
                        <span class="label">current:</span>
                        <span id="ptr-next" class="value">0x----</span>
                    </div>
                </div>

                <div class="card">
                    <h3>Add New Bus</h3>
                    <div class="add-bus-form">
                        <input type="text" id="in-name" placeholder="Name (max 20 chars)">
                        <input type="number" id="in-distance" placeholder="Distance (0-1000)">
                        <input type="number" id="in-duration" placeholder="Duration (10-100)">
                        <input type="number" id="in-frequency" placeholder="Frequency (1-50)">
                        <button id="btn-add-bus" class="btn-primary" style="margin-top: 0.5rem;">Add Line</button>
                    </div>
                </div>
            </section>

            <section class="visualization-arena">
                <div id="bus-container" class="bus-container">
                    <!-- Bus cards will be injected here -->
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
